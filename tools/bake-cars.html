<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>bake</title></head><body>
<script src="/vendor/three.min.js"></script>
<script type="module">
import { buildCar, makeEnv } from '/js/car3d.js';
import { CONFIG } from '/js/config.js';
import { spriteList, FRAME_L, FRAME_W, FATTEN } from '/js/sheet.js';
const T = globalThis.THREE;
const list = spriteList(CONFIG);
const r = new T.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.toneMapping = T.ACESFilmicToneMapping; r.outputColorSpace = T.SRGBColorSpace; r.setClearColor(0, 0);
const scene = new T.Scene();
scene.environment = makeEnv(T, r, false, false);
scene.add(new T.HemisphereLight('#ffffff', '#555566', 0.7));
const sun = new T.DirectionalLight('#ffffff', 1.5); sun.position.set(-2.5, 8, 3); scene.add(sun);
const AW = 2048;
const rows = [];
let x = 0; let y = 0; let rowH = 0;
const cells = {};
for (const it of list) {
  const w = it.px; const h = Math.ceil(it.px * it.ar);
  if (x + w > AW) { x = 0; y += rowH + 2; rowH = 0; }
  cells[it.key] = [x, y, w, h];
  x += w + 2; rowH = Math.max(rowH, h);
}
const AH = y + rowH;
const atlas = document.createElement('canvas'); atlas.width = AW; atlas.height = AH;
const g = atlas.getContext('2d');
const SS = 2; // Süper örnekleme: küçük boyutta temiz kenar
for (const it of list) {
  const [cx, cy, w, h] = cells[it.key];
  r.setSize(w * SS, h * SS, false);
  const car = buildCar(T, it.model, { ...it.paint, sprite: 1 });
  const { L, W } = car.userData;
  const holder = new T.Group();
  car.position.x = -L / 2;
  holder.add(car);
  holder.rotation.y = Math.PI; // Burun +x yönüne
  holder.scale.z = FATTEN;
  scene.add(holder);
  const fw = (L * FRAME_L) / 2;
  const fh = fw * (h / w);
  const cam = new T.OrthographicCamera(-fw, fw, fh, -fh, 0.1, 50);
  cam.position.set(0, 20, 0); cam.up.set(0, 0, -1); cam.lookAt(0, 0, 0);
  r.render(scene, cam);
  g.drawImage(r.domElement, cx, cy, w, h);
  scene.remove(holder);
  holder.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
}
window.__out = { data: atlas.toDataURL('image/webp', 0.9), sheet: { w: AW, h: AH, cells } };
document.title = 'hazir';
</script></body></html>
