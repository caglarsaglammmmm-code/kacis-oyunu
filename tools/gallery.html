<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Araç Galerisi</title>
<style>body{margin:0;background:#191c24;color:#eef;font:600 14px Nunito,Arial}#g{display:grid;grid-template-columns:repeat(2,640px);gap:6px}figure{margin:0;background:#2a2f3a;border-radius:6px;overflow:hidden}figcaption{padding:4px 8px;font-weight:800}img{display:block}figure>div{display:grid;grid-template-columns:320px 320px}</style>
</head><body><div id="g"></div>
<script src="/vendor/three.min.js"></script>
<script type="module">
import { buildCar, makeEnv, CAR_MODELS } from '/js/car3d.js';
import { CONFIG } from '/js/config.js';
const T = globalThis.THREE;
const q = new URLSearchParams(location.search);
const only = q.get('only') ? q.get('only').split(',') : null;
const r = new T.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(320, 200); r.toneMapping = T.ACESFilmicToneMapping; r.outputColorSpace = T.SRGBColorSpace;
const env = makeEnv(T, r, false, false);
const scene = new T.Scene(); scene.environment = env;
scene.add(new T.HemisphereLight('#ffffff', '#444455', 0.55));
const sun = new T.DirectionalLight('#ffffff', 1.1); sun.position.set(-3, 8, 4); scene.add(sun);
const list = [...CONFIG.cars.map((c) => ({ id: c.shape, name: c.name, paint: { color: c.paints[0].color, finish: c.paints[0].finish, roof: c.paints[0].roof, accent: c.paints[0].accent, premium: 1 } })), { id: 'moto', name: 'Motosiklet', paint: { color: '#e8352e', accent: '#ffe14d', finish: 'gloss' } }];
for (const k of Object.keys(CONFIG.npc.types)) { const t = CONFIG.npc.types[k]; if (!list.some((o) => o.id === (t.model || k))) list.push({ id: t.model || k, name: t.model || k, paint: { color: t.colors[0], finish: 'gloss', accent: t.colors[1], sign: k === 'taxi' ? { text: 'TAKSİ', c: '#ffd23f' } : null } }); }
list.push({ id: 'egea', name: 'Taksi (Egea)', paint: { color: '#f7c600', finish: 'gloss', sign: { text: 'TAKSİ', c: '#ffd23f' } } });
const box = document.getElementById('g');
const shot = (cam) => { r.render(scene, cam); return r.domElement.toDataURL('image/png'); };
for (const it of list) {
  if (only && !only.includes(it.id)) continue;
  const car = buildCar(T, it.id, it.paint);
  const { L, W, H } = car.userData;
  car.position.x = -L / 2;
  scene.add(car);
  const k = Math.max(L, W * 2) * 0.56;
  const pc = new T.PerspectiveCamera(26, 1.6, 0.1, 100);
  pc.position.set(-k * 2.5, H * 1.5 + k * 0.9, k * 2.6); pc.lookAt(0, H * 0.42, 0);
  const a = shot(pc);
  const rear = new T.PerspectiveCamera(26, 1.6, 0.1, 100);
  rear.position.set(k * 2.5, H * 1.3 + k * 0.7, k * 2.6); rear.lookAt(0, H * 0.42, 0);
  const b = shot(rear);
  const side = new T.OrthographicCamera(-k * 1.04, k * 1.04, k * 0.65, -k * 0.65, 0.1, 100);
  side.position.set(0, H * 0.5, 20); side.lookAt(0, H * 0.5, 0);
  const c = shot(side);
  const top = new T.OrthographicCamera(-k * 1.04, k * 1.04, k * 0.65, -k * 0.65, 0.1, 100);
  top.position.set(0, 20, 0); top.up.set(0, 0, -1); top.lookAt(0, 0, 0);
  const d = shot(top);
  scene.remove(car);
  const f = document.createElement('figure');
  f.innerHTML = `<figcaption>${it.name}</figcaption><div><img src="${a}"><img src="${b}"><img src="${c}"><img src="${d}"></div>`;
  box.appendChild(f);
}
document.title = 'hazir';
</script></body></html>
